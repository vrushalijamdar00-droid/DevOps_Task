---
- name: Install Java on backend servers
  hosts: backend
  become: true

  tasks:
    - name: Install Java
      ansible.builtin.apt:
        name: "{{ java_package }}"
        state: present
        update_cache: true

    - name: Verify Java version
      ansible.builtin.command: java -version
      register: java_result
      changed_when: false

    - name: Display Java version
      ansible.builtin.debug:
        var: java_result.stderr